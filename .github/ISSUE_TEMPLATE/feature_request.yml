name: Idea / feature request
description: Something PortIT should do that it can't yet
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should PortIT do?
      placeholder: "Port the hair with its animation (so it moves in the game)"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
  - type: textarea
    id: example
    attributes:
      label: An example (wrestler, game, picture)
